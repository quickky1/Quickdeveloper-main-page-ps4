<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d18">
<title>QuickDeveloper PS4</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#172b4a 0%,#0b1322 48%,#070b13 100%);color:#f4f7ff;font-family:Arial,Helvetica,sans-serif}
.container{width:100%;max-width:440px;text-align:center}
.brand{font-size:clamp(28px,7vw,36px);font-weight:800;letter-spacing:-1px;margin-bottom:38px}
.brand span{color:#55aaff}
.card{padding:36px 26px 30px;border:1px solid #263c5b;border-radius:22px;background:linear-gradient(145deg,#14243a,#0d1728);box-shadow:0 22px 70px #0008}
.eyebrow{color:#8da8c9;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.console{font-size:23px;font-weight:750;margin:12px 0 28px}
.version-button{display:block;width:100%;padding:17px 24px;border-radius:13px;background:linear-gradient(135deg,#83d2ff,#398cf0);color:#07111e;font-size:21px;font-weight:850;text-decoration:none;box-shadow:0 8px 26px #267ed455;transition:transform .15s,filter .15s}
.version-button:hover{transform:translateY(-2px);filter:brightness(1.1)}
.hint{color:#91a4bd;font-size:13px;margin-top:18px}
.footer{color:#60738c;font-size:12px;margin-top:24px}
</style>
</head>
<body>
<main class="container">
<h1 class="brand">QuickDeveloper <span>PS4</span></h1>
<section class="card">
<div class="eyebrow">Select Version</div>
<div class="console">PlayStation 4</div>
<a class="version-button" href="https://quickky1.github.io/quickdeveloper-ps4/" target="_blank" rel="noopener noreferrer">14.00</a>
<p class="hint">Select 14.00 to continue.</p>
</section>
<p class="footer">QuickDeveloper PS4</p>
</main>
</body>
</html>
